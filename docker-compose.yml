version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: django_db
    restart: always
    environment:
      MYSQL_DATABASE: django_db_name
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: django_user
      MYSQL_PASSWORD: djangopassword
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: