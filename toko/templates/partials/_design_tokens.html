<style>
/* ════════════════════════════════════════════════════════════════════════════
   MBG DESIGN SYSTEM — Modern Automotive · Premium Minimalism · Clean Dashboard
   Single Source of Truth untuk Design Tokens & Shared Component Sizing
   Target utama: Desktop 100% browser zoom (1280px–1440px+), Tablet, Mobile
   ════════════════════════════════════════════════════════════════════════════ */
:root {
    /* Brand & Surfaces */
    --mbg-navy:          #080D1A;
    --mbg-deep:          #0C1222;
    --mbg-slate:         #131B2E;
    --mbg-blue:          #2563EB;
    --mbg-blue-hover:    #1D4ED8;
    --mbg-blue-soft:     rgba(37, 99, 235, 0.08);
    --mbg-blue-glow:     rgba(37, 99, 235, 0.25);
    --mbg-sky:           #38BDF8;
    --mbg-gold:          #F59E0B;
    --mbg-emerald:       #10B981;
    --mbg-red:           #EF4444;

    --mbg-surface:       #F8FAFC;
    --mbg-surface-alt:   #F1F5F9;
    --mbg-card:          #FFFFFF;
    --mbg-border:        #E2E8F0;
    --mbg-border-subtle: #F1F5F9;

    /* Text */
    --mbg-text:          #334155;
    --mbg-text-dark:     #0F172A;
    --mbg-text-muted:    #64748B;
    --mbg-text-light:    #94A3B8;

    /* Radii */
    --radius-xl:         16px;
    --radius-lg:         12px;
    --radius-md:         10px;
    --radius-sm:         8px;

    /* Shadows (halus & minimal) */
    --shadow-card:       0 1px 3px rgba(8, 13, 26, 0.04), 0 4px 16px -4px rgba(8, 13, 26, 0.05);
    --shadow-hover:      0 10px 26px -6px rgba(8, 13, 26, 0.11);
    --shadow-dropdown:   0 10px 28px -4px rgba(8, 13, 26, 0.12);

    /* Sizing & Spacing */
    --nav-height:        64px;
    --container-max:     1280px;
    --sidebar-width:     256px;
    --btn-height:        40px;
    --btn-height-sm:     32px;
    --input-height:      40px;

    /* Typography */
    --text-body:         14.5px;
    --text-sm:           13px;
    --text-xs:           12px;
    --transition-snappy: cubic-bezier(.16, 1, .3, 1);
}

/* Base Typography & Scroll */
*, *::before, *::after { box-sizing: border-box; }
body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: var(--text-body);
    line-height: 1.55;
    color: var(--mbg-text);
    background: var(--mbg-surface);
    -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5, h6, .font-heading {
    font-family: 'Montserrat', sans-serif;
    letter-spacing: -0.02em;
    color: var(--mbg-navy);
}
h1, .h1 { font-size: clamp(1.35rem, 2.2vw, 1.75rem); line-height: 1.25; }
h2, .h2 { font-size: clamp(1.15rem, 1.6vw, 1.4rem); line-height: 1.3; }
h3, .h3 { font-size: 1.125rem; line-height: 1.35; }
h4, .h4 { font-size: 1rem; line-height: 1.35; }

/* Unified Form Controls */
.form-control, .form-select {
    min-height: var(--input-height);
    border-radius: var(--radius-md);
    border: 1px solid var(--mbg-border);
    padding: 0.48rem 0.8rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--mbg-text-dark);
    background-color: #FFFFFF;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
textarea.form-control { min-height: 88px; }
.form-control-sm, .form-select-sm {
    min-height: 34px;
    padding: 0.3rem 0.65rem;
    font-size: 0.8125rem;
    border-radius: var(--radius-sm);
}
.form-control:focus, .form-select:focus {
    border-color: var(--mbg-blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}
.form-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mbg-text-muted);
    margin-bottom: 0.35rem;
}

/* Unified Button System */
.btn {
    font-size: 0.875rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    padding: 0.48rem 1rem;
    transition: all 0.18s var(--transition-snappy);
}
.btn-lg {
    min-height: 44px;
    padding: 0.55rem 1.25rem;
    font-size: 0.92rem;
}
.btn-sm {
    min-height: 32px;
    padding: 0.28rem 0.72rem;
    font-size: 0.78rem;
    border-radius: var(--radius-sm);
}
.btn-primary {
    background-color: var(--mbg-blue);
    border-color: var(--mbg-blue);
}
.btn-primary:hover, .btn-primary:focus {
    background-color: var(--mbg-blue-hover);
    border-color: var(--mbg-blue-hover);
}
.btn:disabled, .btn.disabled { opacity: 0.6; cursor: not-allowed; }

/* Unified Dashboard Cards & Tables */
.content-card {
    background: var(--mbg-card);
    border: 1px solid var(--mbg-border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    box-shadow: var(--shadow-card);
    margin-bottom: 1.15rem;
}
.card-header-clean {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--mbg-border-subtle);
    padding-bottom: 0.75rem;
    margin-bottom: 1rem;
    gap: 0.75rem;
    flex-wrap: wrap;
}
.stat-card {
    background: var(--mbg-card);
    border: 1px solid var(--mbg-border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.15rem;
    box-shadow: var(--shadow-card);
    height: 100%;
}
.table {
    font-size: 0.84rem;
    margin-bottom: 0;
}
.table thead th {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mbg-text-muted);
    background-color: var(--mbg-surface);
    border-bottom: 1px solid var(--mbg-border);
    padding: 0.6rem 0.75rem;
    white-space: nowrap;
}
.table tbody td {
    padding: 0.65rem 0.75rem;
    vertical-align: middle;
    border-bottom-color: var(--mbg-border-subtle);
}
.badge {
    font-weight: 600;
    font-size: 0.72rem;
    padding: 0.3em 0.65em;
}
